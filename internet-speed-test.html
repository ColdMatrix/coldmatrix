  <style>
    :root {
      --bg:#0B0F14;
      --foam:#F0F4F8;
      --frost:#4FC3F7;
      --line:rgba(79,195,247,0.35);
      --accent:#00b894;
      --card-bg:rgba(15,22,30,0.92);
      --gold:#D4AF37;
      --gold-border:linear-gradient(145deg,#C8993A,#E8C96A 30%,#A07828 70%,#D4A843);
      --whatsapp-green:#25D366;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg, rgba(11,15,20,0.92), rgba(11,15,20,0.96)), url('speed_test.jpg') center/cover fixed no-repeat;
      color: var(--foam);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .navbar { position: sticky; top:0; z-index:100; background: rgba(8,12,20,0.94); backdrop-filter: blur(18px); border-bottom:1px solid rgba(255,255,255,0.06); }
    .nav-inner { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; flex-wrap:wrap; max-width:1000px; margin:0 auto; }
    .logo { font-size:1.3rem; font-weight:800; color:var(--frost); text-decoration:none; display:flex; align-items:center; gap:8px; }
    .nav-links { display:flex; gap:18px; list-style:none; flex-wrap:wrap; }
    .nav-links a { color:#9AA0B0; text-decoration:none; font-weight:600; font-size:0.9rem; transition:color 0.2s; }
    .nav-links a:hover { color:var(--accent); }

    .container { max-width:900px; margin:30px auto; padding:0 20px; }

    .hero-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border:2px solid; border-image: var(--gold-border) 1;
      border-radius:24px; padding:36px 28px; margin-bottom:30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,215,0,0.2);
      text-align:center;
    }
    .hero-card h1 {
      font-family:'Oswald',sans-serif; font-size:2.4rem; font-weight:700;
      color:#fff; margin-bottom:8px; text-shadow:0 2px 8px rgba(0,0,0,0.8);
    }
    .hero-card p { color:#B9C0CE; font-size:1rem; margin-bottom:20px; }
    .btn-start {
      background: linear-gradient(135deg, #4FC3F7, #2196F3);
      color:#0B0F14; border:none; padding:16px 40px; border-radius:50px;
      font-family:'Oswald',sans-serif; font-weight:700; font-size:1.2rem;
      text-transform:uppercase; cursor:pointer; letter-spacing:1px;
      box-shadow: 0 8px 24px rgba(79,195,247,0.4); transition: transform 0.2s;
    }
    .btn-start:hover { transform:translateY(-2px); }
    .btn-start:disabled { opacity:0.6; cursor:not-allowed; }

    .results-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-bottom:30px; }
    .result-card {
      background:var(--card-bg); backdrop-filter:blur(16px);
      border:1px solid var(--line); border-radius:18px; padding:20px;
      text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.5);
    }
    .result-card .label { font-size:0.8rem; color:#8B98A5; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .result-card .value { font-family:'Oswald',sans-serif; font-size:2.2rem; font-weight:700; color:var(--frost); }
    .result-card .unit { font-size:0.9rem; color:#B9C0CE; }

    .gauge-container { position:relative; width:200px; margin:0 auto 20px; }
    .gauge-ring {
      transform: rotate(-90deg);
    }
    .gauge-ring .bg { stroke: rgba(79,195,247,0.15); }
    .gauge-ring .fg { stroke: var(--frost); stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }

    .server-note {
      text-align:center; color:#8B98A5; font-size:0.8rem; margin-top:10px;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><i class="fa-solid fa-snowflake"></i> ColdMatrix</a>
      <ul class="nav-links">
        <li><a href="index.html">🏠 Home</a></li>

        <li><a href="solutions.html">❄️ Cold Matrix</a></li>
        <li><a href="blog.html">📝 Blog</a></li>
        <li><a href="about.html">ℹ️ About</a></li>
        <li><a href="contact.html">📞 Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="hero-card">
      <h1>🌐 Internet Speed Test</h1>
      <p>Measure download, upload, ping, and jitter — using multiple global servers for better accuracy. 100% private and ad-free.</p>
      <button class="btn-start" id="startBtn" onclick="runSpeedTest()">⚡ Start Test</button>
    </div>

    <!-- Results -->
    <div class="results-grid" id="resultsGrid" style="display:none;">
      <div class="result-card">
        <div class="label">⬇ Download</div>
        <div class="value" id="downloadValue">—</div>
        <div class="unit">Mbps</div>
      </div>
      <div class="result-card">
        <div class="label">⬆ Upload</div>
        <div class="value" id="uploadValue">—</div>
        <div class="unit">Mbps</div>
      </div>
      <div class="result-card">
        <div class="label">📶 Ping</div>
        <div class="value" id="pingValue">—</div>
        <div class="unit">ms</div>
      </div>
      <div class="result-card">
        <div class="label">📊 Jitter</div>
        <div class="value" id="jitterValue">—</div>
        <div class="unit">ms</div>
      </div>
    </div>

    <div class="server-note" id="serverNote"></div>
  </div>

  <script>
    // Multi-server endpoints (Cloudflare + your own)
    const TEST_ENDPOINTS = {
      cloudflareDown: 'https://speed.cloudflare.com/__down?bytes=10000000',
      cloudflareUp: 'https://speed.cloudflare.com/__up',
      localDown: 'https://coldmatrixtools.com/speedtest-data.bin', // optional local
      pingEndpoints: [
        'https://speed.cloudflare.com/__down?bytes=1',
        'https://coldmatrixtools.com/',
        'https://www.google.com/generate_204'
      ]
    };

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function measurePing() {
      let samples = [];
      for (let i = 0; i < 8; i++) {
        const start = performance.now();
        try {
          await fetch(TEST_ENDPOINTS.pingEndpoints[Math.floor(Math.random() * TEST_ENDPOINTS.pingEndpoints.length)], { mode: 'no-cors', cache: 'no-store' });
          const end = performance.now();
          samples.push(end - start);
        } catch (e) {
          samples.push(0);
        }
        await sleep(50);
      }
      const valid = samples.filter(s => s > 0);
      if (valid.length === 0) return { ping: 0, jitter: 0 };
      const ping = valid.reduce((a,b) => a + b, 0) / valid.length;
      const jitter = valid.length > 1 ? Math.sqrt(valid.reduce((a,b) => a + (b-ping)**2, 0) / (valid.length - 1)) : 0;
      return { ping, jitter };
    }

    async function measureDownload() {
      const start = performance.now();
      try {
        const res = await fetch(TEST_ENDPOINTS.cloudflareDown, { cache: 'no-store' });
        const blob = await res.blob();
        const end = performance.now();
        const durationSec = (end - start) / 1000;
        const bits = blob.size * 8;
        const Mbps = (bits / durationSec) / (1024 * 1024);
        return Mbps;
      } catch (e) {
        return 0;
      }
    }

    async function measureUpload() {
      const payload = new Blob([new Uint8Array(5 * 1024 * 1024)], { type: 'application/octet-stream' }); // 5MB
      const start = performance.now();
      try {
        await fetch(TEST_ENDPOINTS.cloudflareUp, { method: 'POST', body: payload, cache: 'no-store' });
        const end = performance.now();
        const durationSec = (end - start) / 1000;
        const bits = payload.size * 8;
        return (bits / durationSec) / (1024 * 1024);
      } catch (e) {
        return 0;
      }
    }

    async function runSpeedTest() {
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = true;
      startBtn.textContent = '⏳ Testing...';

      // Ping & Jitter
      const { ping, jitter } = await measurePing();
      document.getElementById('pingValue').textContent = ping > 0 ? Math.round(ping) : '—';
      document.getElementById('jitterValue').textContent = jitter > 0 ? Math.round(jitter) : '—';

      // Download
      const download = await measureDownload();
      document.getElementById('downloadValue').textContent = download > 0 ? download.toFixed(2) : '—';

      // Upload
      const upload = await measureUpload();
      document.getElementById('uploadValue').textContent = upload > 0 ? upload.toFixed(2) : '—';

      // Show results
      document.getElementById('resultsGrid').style.display = 'grid';
      document.getElementById('serverNote').textContent = '✅ Results from Cloudflare global network + local server. Privacy respected.';
      startBtn.disabled = false;
      startBtn.textContent = '⚡ Test Again';
    }
  </script>
</body>
</html>

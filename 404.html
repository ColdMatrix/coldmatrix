<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://coldmatrixtools.com/">
  <meta name="robots" content="noindex, follow">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to <a href="https://coldmatrixtools.com/">ColdMatrix Tools</a>...</p>
<div id="cookie-notice" style="position:fixed; bottom:0; left:0; right:0; background:#12181F; border-top:3px solid #D4AF37; padding:15px 20px; text-align:center; z-index:99999; display:block; box-shadow:0 -4px 20px rgba(0,0,0,0.7); font-family:'Inter',sans-serif;">
  <p style="color:#EAEDF0; font-size:0.9rem; margin:0 0 10px; line-height:1.6; max-width:800px; margin-left:auto; margin-right:auto;">We use cookies to improve your experience and serve relevant ads. Read our <a href="privacy-policy.html" style="color:#FFD700; text-decoration:underline;">Privacy Policy</a> and <a href="cookie-policy.html" style="color:#FFD700; text-decoration:underline;">Cookie Policy</a>.</p>
  <button id="cookieAcceptBtn" style="background:#FFD700; color:#0A0F14; border:none; padding:10px 24px; border-radius:6px; font-weight:800; cursor:pointer; font-size:0.85rem; margin:0 4px; min-height:44px;">ACCEPT</button>
  <button id="cookieDeclineBtn" style="background:transparent; color:#C3CBD4; border:2px solid #2A3540; padding:10px 24px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.85rem; margin:0 4px; min-height:44px;">DECLINE</button>
</div>
<script>
  (function(){
    var box = document.getElementById('cookie-notice');
    if (localStorage.getItem('cookieChoice')) { box.style.display = 'none'; }
    document.getElementById('cookieAcceptBtn').onclick = function(){ localStorage.setItem('cookieChoice','accepted'); box.style.display = 'none'; };
    document.getElementById('cookieDeclineBtn').onclick = function(){ localStorage.setItem('cookieChoice','declined'); box.style.display = 'none'; };
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://coldmatrixtools.com/">
  <meta name="robots" content="noindex, follow">
  <title>Redirecting...</title>
</head>
<body>
  <h1>404 — Page Not Found</h1>
  <p>Redirecting to <a href="https://coldmatrixtools.com/">ColdMatrix Tools</a>...</p>
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="privacy-policy.html#ccpa">Do Not Sell My Info</a>
    <a href="#" onclick="resetCookieConsent(); return false;">Cookie Settings</a>
    <a href="terms-of-use.html">Terms of Use</a>
    <a href="cookie-policy.html">Cookie Policy</a>
    <a href="security.html">Security</a>
    <a href="author.html">Author</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
  </footer>
<div id="cookie-notice" style="position:fixed; bottom:0; left:0; right:0; background:#E8EBEF; border-top:3px solid #D4AF37; padding:15px 20px; text-align:center; z-index:99999; display:block; box-shadow:0 -4px 20px rgba(0,0,0,0.25); font-family:'Inter',sans-serif;">
  <p style="color:#0A0F14; font-size:0.9rem; margin:0 0 10px; line-height:1.6; max-width:800px; margin-left:auto; margin-right:auto;">We use cookies to improve your experience and serve relevant ads. Read our <a href="privacy-policy.html" style="color:#A07828; text-decoration:underline; font-weight:700;">Privacy Policy</a> and <a href="cookie-policy.html" style="color:#A07828; text-decoration:underline; font-weight:700;">Cookie Policy</a>.</p>
  <button id="cookieAcceptBtn" style="background:#FFD700; color:#0A0F14; border:none; padding:10px 24px; border-radius:6px; font-weight:800; cursor:pointer; font-size:0.85rem; margin:0 4px; min-height:44px;">ACCEPT</button>
  <button id="cookieDeclineBtn" style="background:transparent; color:#2A3138; border:2px solid #8B98A5; padding:10px 24px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.85rem; margin:0 4px; min-height:44px;">DECLINE</button>
</div>
<script>
(function(){
  var box = document.getElementById('cookie-notice');
  if (!box) return;
  var choice = localStorage.getItem('cookieChoice');
  var choiceTime = localStorage.getItem('cookieTime');
  var now = Date.now();
  var sevenDays = 7 * 24 * 60 * 60 * 1000;

  if (!choice || !choiceTime || (now - parseInt(choiceTime)) > sevenDays) {
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }

  var acceptBtn = document.getElementById('cookieAcceptBtn');
  var declineBtn = document.getElementById('cookieDeclineBtn');

  if (acceptBtn) {
    acceptBtn.onclick = function(){
      localStorage.setItem('cookieChoice','accepted');
      localStorage.setItem('cookieTime', now);
      location.reload();
    };
  }
  if (declineBtn) {
    declineBtn.onclick = function(){
      localStorage.setItem('cookieChoice','declined');
      localStorage.setItem('cookieTime', now);
      box.style.display = 'none';
    };
  }
})();
function resetCookieConsent() { localStorage.removeItem('cookieChoice'); localStorage.removeItem('cookieTime'); location.reload(); }
</script>
</body>
</html>
